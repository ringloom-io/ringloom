# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "**"

permissions:
  contents: read

env:
  ZIG_VERSION: 0.16.0
  JAVA_VERSION: "25"
  GRADLE_VERSION: current
  RELEASE_TARGET: x86_64-linux-gnu.2.28

jobs:
  test:
    name: Build and test
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Run Zig unit and integration tests
        run: zig build test

      - name: Run end-to-end tests
        run: zig build e2e

      - name: Run Java integration tests
        run: zig build test-java

  release:
    name: Release tag
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Derive release version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ -z "$version" ]]; then
            echo "Could not derive version from tag '${GITHUB_REF_NAME}'" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Run Zig unit and integration tests
        run: zig build test

      - name: Run end-to-end tests
        run: zig build e2e

      - name: Run Java integration tests
        run: zig build test-java

      - name: Build Linux x86_64 release artifacts
        run: zig build -Dtarget=${{ env.RELEASE_TARGET }} -Doptimize=ReleaseFast

      - name: Package broker tarball
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          package="ringloom-broker-${version}-x86_64-linux"
          mkdir -p "dist/${package}/bin"
          cp zig-out/bin/ringloom-broker "dist/${package}/bin/ringloom-broker"
          tar -czf "dist/${package}.tar.gz" -C dist "${package}"
          sha256sum "dist/${package}.tar.gz" > "dist/${package}.tar.gz.sha256"

      - name: Build Java bindings jar
        working-directory: bindings/java
        run: >
          gradle --no-daemon jar
          -Pringloom.version=${{ steps.version.outputs.version }}
          -Pringloom.embeddedNativeLibDir=${{ github.workspace }}/zig-out/lib

      - name: Stage Java bindings jar
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          cp "bindings/java/build/libs/ringloom-java-bindings-${version}.jar" \
            "dist/ringloom-java-bindings-${version}-linux-x86_64.jar"
          sha256sum "dist/ringloom-java-bindings-${version}-linux-x86_64.jar" \
            > "dist/ringloom-java-bindings-${version}-linux-x86_64.jar.sha256"

      - name: Upload broker artifact
        uses: actions/upload-artifact@v4
        with:
          name: ringloom-broker-${{ steps.version.outputs.version }}-x86_64-linux
          path: |
            dist/ringloom-broker-${{ steps.version.outputs.version }}-x86_64-linux.tar.gz
            dist/ringloom-broker-${{ steps.version.outputs.version }}-x86_64-linux.tar.gz.sha256
          if-no-files-found: error

      - name: Upload Java bindings artifact
        uses: actions/upload-artifact@v4
        with:
          name: ringloom-java-bindings-${{ steps.version.outputs.version }}-linux-x86_64
          path: |
            dist/ringloom-java-bindings-${{ steps.version.outputs.version }}-linux-x86_64.jar
            dist/ringloom-java-bindings-${{ steps.version.outputs.version }}-linux-x86_64.jar.sha256
          if-no-files-found: error

      - name: Publish Java bindings to Maven Central
        working-directory: bindings/java
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_IN_MEMORY_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: >
          gradle --no-daemon publishToMavenCentral
          -Pringloom.version=${{ steps.version.outputs.version }}
          -Pringloom.embeddedNativeLibDir=${{ github.workspace }}/zig-out/lib
